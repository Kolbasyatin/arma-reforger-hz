# На сервере: лежит в /opt/arma-reforger-hz рядом с папкой data/.
# Порт наружу не публикуется. Потребитель (tsbot-monitor из репозитория teamspeakbot) ходит
# на http://arma-reforger-hz:8080/token через общую внешнюю docker-сеть arma-shared:
# её создаёт systemd-юнит в ExecStartPre (docker network create arma-shared), оба compose
# подключают её как external, поэтому down любого из них сеть не сносит.

services:
  service:
    image: ghcr.io/kolbasyatin/arma-reforger-hz:latest
    container_name: arma-reforger-hz
    volumes:
      - ./data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - default
      - arma

  # Интерактивный Steam-логин. Не стартует сам — только через steam-login.sh.
  cli:
    image: ghcr.io/kolbasyatin/arma-reforger-hz:latest
    profiles: [tools]
    entrypoint: ["dotnet", "cli/ArmaReforger.Cli.dll"]
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data

networks:
  arma:
    name: arma-shared
    external: true
